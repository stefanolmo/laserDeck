[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "laserdeck"
version = "0.1.0"
description = "G-code sender and SVG converter for GRBL 1.1 laser engravers (Longer Ray5 mini and compatible)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6-Essentials>=6.5", "pyserial>=3.5", "numpy>=1.24", "pyclipper>=1.3", "svgelements>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
laserdeck = "laserdeck.__main__:main"

[tool.setuptools]
packages = ["laserdeck"]

[tool.setuptools.package-data]
laserdeck = ["laserdeck.svg"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
